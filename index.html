<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZJO1024 (Blank)</title>
    <meta name="description" content="ZJO1024" />
    <link rel="canonical" href="https://zjo1024.github.io/" />
    <style>
        @font-face {
            font-family: 'Block Out 2097';
            src: url('fonts/bo.ttf') format('truetype');
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 0;
            padding-bottom: 8vh;
            background-color: #101012;
            font-family: 'Arial', 'Helvetica', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow-x: hidden;
        }
        .main-title {
            font-family: 'Block Out 2097', 'Arial Black', Impact, 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 72px;
            font-weight: 900;
			color: #eeeeee;
            letter-spacing: 4px;
            transform: scaleY(1.15);
            display: inline-block;
            transform-origin: center center;
            will-change: transform;
            line-height: 1.2;
            text-align: center;
            margin-top: 0.1em;
        }
        .subtitle {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-size: 12px;
            font-weight: normal;
            color: #eeeeee;
            line-height: 1.5;
            text-align: center;
            margin-top: 4rem;
            transform: none;
            letter-spacing: normal;
        }

        @media (max-width: 600px) {
            .main-title {
                font-size: 48px;
                letter-spacing: 2px;
            }
            .subtitle {
                margin-top: 2.5rem;
                font-size: 11px;
            }
            body {
                padding-top: 10vh;
                padding-bottom: 6vh;
            }
        }
        @media (max-width: 360px) {
            .main-title {
                font-size: 36px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>
    <h1 class="main-title">ZJO1024</h1>
    <p class="subtitle">ZJO1024's GitHub Page.</p>

    <script>
        (function() {
            const queryString = window.location.search;
            const params = new URLSearchParams(queryString);

            if (params.get('sh') === '1') {
                const subtitle = document.querySelector('.subtitle');
                if (subtitle) {
                    subtitle.style.visibility = 'hidden';
                    subtitle.style.pointerEvents = 'none';
                }
            }
        })();
    </script>
</body>
</html>
